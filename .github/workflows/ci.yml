name: SOLEX test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: weknora
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '4'
      GOFLAGS: -mod=readonly
      WEKNORA_LOG_FORMAT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: weknora/go.mod
          cache-dependency-path: weknora/go.sum
      - name: Resolve mocked URL-validation hostnames deterministically
        # These public IPs are used only for validation in mocked tests.
        run: |
          printf '%s\n' '93.184.216.34 example.com' '8.8.8.8 api.e2b.app' | sudo tee -a /etc/hosts >/dev/null
      - name: Test current application packages
        # Unit tests do not link the AnyDoc engine. Production binaries must
        # still use deploy/solex-runtime/build-backend.sh (CGO + AnyDoc).
        run: |
          go test -timeout 10m \
            ./internal/types \
            ./internal/runtime \
            ./internal/agent \
            ./internal/agent/collaboration \
            ./internal/application/repository \
            ./internal/application/service \
            ./internal/handler \
            ./internal/handler/session \
            ./internal/router \
            ./internal/database \
            ./internal/container
          go test -timeout 2m ./internal/agent/tools -run '^TestCollaboration' -count=1

  frontend:
    name: SOLEX UI regression tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: weknora/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: weknora/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run SOLEX workflow regression tests
        run: |
          npm test -- \
            src/config/managedRuntime.test.ts \
            src/config/systemAgents.test.ts \
            src/stores/assistant.branding.test.ts \
            src/stores/chatResources.test.ts \
            src/utils/branding.test.ts \
            src/utils/knowledgeAttribution.test.ts \
            src/components/Input-field.focus.test.mjs \
            src/components/modelSelectorFilter.test.ts \
            src/components/document-attribution.integration.test.ts \
            src/composables/useKnowledgeActivity.test.ts \
            src/composables/useSkillInstallerModel.test.ts \
            src/hooks/useKnowledgeBase.test.ts \
            src/views/agent/AgentEditorModal.test.mjs \
            src/views/agent/AgentList.test.ts \
            src/views/agent/managedAgentSave.test.ts \
            src/views/system/agentRuntimeSettings.test.ts \
            src/views/knowledge/components/DocumentFolderEntries.test.ts \
            src/views/settings/SkillSettings.filters.test.ts
      - run: npm run type-check
      - run: npm run build
        env:
          VITE_FRONTEND_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: solex-frontend
          path: weknora/frontend/dist/
          if-no-files-found: error

  deployment:
    name: Release packaging and rollback unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Both suites use temporary directories and synthetic fixtures. Live
      # acceptance scripts require a deployed service and are not CI tests.
      - run: python -m unittest discover -s deploy/solex-runtime -p 'test_*.py' -v
      - run: python -m unittest discover -s deploy/solex-ui -p 'test_*.py' -v
      - name: Check release shell syntax
        run: |
          for script in deploy/solex-runtime/build-backend.sh deploy/solex-runtime/apply.sh deploy/solex-ui/apply.sh; do
            bash -n "$script"
          done
